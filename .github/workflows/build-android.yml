# Android build → Play Console internal track.
#
# Required repo secrets:
#   ANDROID_KEYSTORE_BASE64         — base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD       — store password
#   ANDROID_KEY_ALIAS               — key alias (typically "upload")
#   ANDROID_KEY_PASSWORD            — alias password
#   PLAY_SERVICE_ACCOUNT_JSON       — full JSON of a Google Cloud service account with
#                                     Play Console "Release manager" or "Release apps to
#                                     testing tracks" permission on this app
#
# Setup steps (one-time):
#   1. Generate keystore locally and back it up off-machine:
#        keytool -genkey -v -keystore mesozoic-protocol.keystore -alias upload \
#                -keyalg RSA -keysize 2048 -validity 10000
#      → base64-encode and paste as ANDROID_KEYSTORE_BASE64.
#   2. Play Console → create app, set up internal testing track, link package
#      name `com.ricoslabs.mesozoicprotocol`.
#   3. Play Console → Setup → API access → link a Google Cloud project →
#      create a service account → grant "Release manager" → download JSON.
#      Paste the JSON contents into PLAY_SERVICE_ACCOUNT_JSON.
#   4. First release MUST be uploaded manually through the Play Console UI so
#      Google can validate the app and you can accept distribution terms.
#      After that, this workflow can ship subsequent versions automatically.

name: Build Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to Google Play (disable for the first manual AAB upload)
        required: true
        default: false
        type: boolean
      track:
        description: Play Console track
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
  workflow_call:
    inputs:
      upload:
        description: Upload the verified AAB to Google Play
        default: false
        type: boolean
      track:
        description: Play Console track
        default: internal
        type: string

permissions:
  contents: read

concurrency:
  group: build-android
  cancel-in-progress: false

jobs:
  # Cheap gate: catch a missing secret, a type error, or a half-applied version
  # bump before gradle starts. An empty ANDROID_KEYSTORE_BASE64 decodes to a
  # zero-byte file and surfaces as an opaque "keystore was tampered with"
  # gradle error 10 minutes later — assert presence up front instead.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Names only are printed — never values.
      - name: Verify required secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          UPLOAD_TO_PLAY: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.upload }}
        run: |
          set -euo pipefail
          required=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          if [ "$UPLOAD_TO_PLAY" = "true" ]; then
            required+=(PLAY_SERVICE_ACCOUNT_JSON)
          fi
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing or empty repo secret(s): ${missing[*]}"
            echo "Set them under Settings → Secrets and variables → Actions."
            echo "The header comment in this workflow file explains what each one is."
            exit 1
          fi
          echo "All ${#required[@]} required secrets are present."

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      # See ci.yml for why this is `tsc -b` and not `tsc -b --noEmit`.
      - name: Typecheck
        run: pnpm exec tsc -b

      # The build helper reads package.json and rejects mismatched release tags.
      - name: Version declarations agree
        run: node scripts/sync-version.mjs --check

      - name: Unit tests
        run: pnpm test --maxWorkers=2

      - name: Release version tests
        run: |
          node --test scripts/ci/mobile-build-version.test.mjs scripts/ci/android-signing.test.mjs
          python3 scripts/ci/ios-signing.test.py

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - run: pnpm install --frozen-lockfile

      - name: Resolve store version and build number
        run: node scripts/ci/mobile-build-version.mjs

      - name: Build web bundle and sync Android
        run: |
          pnpm build
          npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          echo -n "$KEYSTORE_B64" | base64 --decode > android/app/upload.keystore

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/ci/android-signing.mjs properties

      - name: Build signed AAB and APK
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Verify AAB and APK use the upload certificate
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: node scripts/ci/android-signing.mjs verify

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload to Play Console
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.upload
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ricoslabs.mesozoicprotocol
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          changesNotSentForReview: false

      - name: Clean up keystore artifacts
        if: always()
        run: |
          rm -f android/app/upload.keystore android/keystore.properties

      - name: Finish reserved build-number minute
        if: always() && env.MOBILE_BUILD_SLOT_END != ''
        run: node scripts/ci/mobile-build-version.mjs --finish-build-slot
