# Tauri Linux build → AppImage + .deb.
#
# No secrets and no signing: Linux has no equivalent of Gatekeeper or
# SmartScreen, so there is nothing to sign against. The artifacts here are what
# a Linux Steam depot uploads, and what itch.io serves on the `linux` channel.
#
# Pinned to ubuntu-22.04 on purpose, NOT ubuntu-latest:
#   * Tauri v2 links against webkit2gtk-4.1. Ubuntu 24.04 ships a newer
#     webkit/libsoup stack, and 22.04 is the oldest runner that still has
#     4.1 packaged — building on the older image keeps the widest range of
#     target distros working.
#   * The produced binary requires at least the glibc of the build machine.
#     Building on 22.04 (glibc 2.35) runs on 22.04+; building on 24.04
#     (glibc 2.39) would silently drop every user on an older LTS.
# Bump this only when you consciously decide to drop those users.

name: Build Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No secret check here — this workflow needs none. The lint/typecheck/version
  # checks still run first so a broken tag fails in ~90s rather than after a
  # full Rust build. Mirrors ci.yml.
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      # See ci.yml for why this is `tsc -b` and not `tsc -b --noEmit`.
      - name: Typecheck
        run: pnpm exec tsc -b

      # tauri.conf.json's version ends up in the AppImage/.deb filenames.
      - name: Version declarations agree
        run: node scripts/sync-version.mjs --check

      - name: Unit tests
        run: pnpm test

  build:
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: cargo-linux-${{ hashFiles('src-tauri/Cargo.lock') }}

      # The Tauri v2 Linux prerequisites. libwebkit2gtk-4.1-dev is the one that
      # actually matters (Wry's WebView); patchelf and librsvg2-dev are needed
      # by the AppImage bundler specifically.
      - name: Install Tauri system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build (Tauri)
        run: pnpm tauri build

      - name: Verify bundles were produced
        run: |
          set -euo pipefail
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name "*.AppImage" | head -1)
          DEB=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name "*.deb" | head -1)
          test -n "$APPIMAGE" || { echo "::error::no AppImage produced"; exit 1; }
          test -n "$DEB" || { echo "::error::no .deb produced"; exit 1; }
          ls -lah "$APPIMAGE" "$DEB"
          # Cheap sanity check that the .deb is a real archive and records the
          # dependencies we expect, rather than an empty shell.
          dpkg-deb --info "$DEB"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      # A Steam depot ships the game directory, not a package — Steam does the
      # installing. This is the unpacked build for .github/workflows/steam.yml.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: src-tauri/target/release/mesozoic-protocol
          if-no-files-found: error
