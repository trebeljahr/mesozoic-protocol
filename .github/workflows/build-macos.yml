# Tauri macOS build, signed with Developer ID Application + notarized.
#
# Required repo secrets:
#   APPLE_TEAM_ID                       — 10-char team identifier (reused from iOS)
#   APPLE_DEVELOPER_ID_CERT_BASE64      — base64 of `Developer ID Application` .p12 (NOT the iOS Apple Distribution cert)
#   APPLE_DEVELOPER_ID_CERT_PASSWORD    — password for that .p12
#   APPLE_DEVELOPER_ID_IDENTITY         — exact identity string, e.g. "Developer ID Application: Ricos Labs LLC (4BHY8H2J25)"
#   APPLE_KEYCHAIN_PASSWORD             — reused from iOS; locks the temp keychain
#   APPSTORE_API_KEY_ID                 — reused from iOS; notarization uses the same ASC API key
#   APPSTORE_API_ISSUER_ID              — reused from iOS
#   APPSTORE_API_KEY_P8_BASE64          — reused from iOS
#
# One-time Apple setup (in addition to what iOS already needed):
#   1. developer.apple.com → Certificates → + → "Developer ID Application" → upload CSR.
#      Note: this is a DIFFERENT cert from "Apple Distribution". You need both.
#   2. Download, import to Keychain, export as .p12 with a password.
#   3. Base64 the .p12 → APPLE_DEVELOPER_ID_CERT_BASE64.
#   4. Identity string is printed by:
#        security find-identity -v -p codesigning login.keychain
#      Pick the line that starts with "Developer ID Application:".

name: Build macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap gate on a Linux runner: catch a missing secret, a type error, or a
  # half-applied version bump in ~90s instead of after a universal-binary
  # Rust build and a notarization round trip. Mirrors ci.yml plus the secret
  # check specific to this workflow.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # An empty cert secret decodes to a zero-byte .p12 and fails deep inside
      # `security import`. Assert presence up front. Names only — never values.
      - name: Verify required secrets are present
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            APPLE_TEAM_ID
            APPLE_DEVELOPER_ID_CERT_BASE64
            APPLE_DEVELOPER_ID_CERT_PASSWORD
            APPLE_DEVELOPER_ID_IDENTITY
            APPLE_KEYCHAIN_PASSWORD
            APPSTORE_API_KEY_ID
            APPSTORE_API_ISSUER_ID
            APPSTORE_API_KEY_P8_BASE64
          )
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing or empty repo secret(s): ${missing[*]}"
            echo "Set them under Settings → Secrets and variables → Actions."
            echo "The header comment in this workflow file explains what each one is."
            exit 1
          fi
          echo "All ${#required[@]} required secrets are present."

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      # See ci.yml for why this is `tsc -b` and not `tsc -b --noEmit`.
      - name: Typecheck
        run: pnpm exec tsc -b

      # tauri.conf.json's version ends up in the DMG filename, so a drifted
      # version produces a mislabelled release artifact.
      - name: Version declarations agree
        run: node scripts/sync-version.mjs --check

      - name: Unit tests
        run: pnpm test

  build:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPLE_API_KEY: ${{ secrets.APPSTORE_API_KEY_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: cargo-macos-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Import Developer ID certificate
        env:
          CERT_B64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/macos-build.keychain"
          echo -n "$CERT_B64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Write ASC API key to disk for notarization
        env:
          API_KEY_B64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo -n "$API_KEY_B64" | base64 --decode > "$KEY_DIR/AuthKey_${API_KEY_ID}.p8"
          echo "APPLE_API_KEY_PATH=$KEY_DIR/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # Decides whether this build also produces the auto-updater payload and
      # its signature. Soft-skips with a ::notice:: until the signing keypair
      # exists — see scripts/ci/updater-gate.sh and DISTRIBUTION.md.
      - name: Auto-updater activation gate
        id: updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bash scripts/ci/updater-gate.sh

      # The updater tarball is packed from the already-signed, notarized and
      # stapled .app, so the update a user installs passes Gatekeeper exactly
      # like a fresh DMG download does.
      - name: Build + sign + notarize (Tauri, universal binary)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin ${{ steps.updater.outputs.args }}

      - name: Verify signature + notarization
        run: |
          set -euo pipefail
          APP_PATH=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 2 -name "*.app" | head -1)
          DMG_PATH=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name "*.dmg" | head -1)
          echo "App: $APP_PATH"
          echo "DMG: $DMG_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | head -20
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl -a -vv -t install "$APP_PATH" || echo "::warning::spctl check failed — notarization stapling may be incomplete"
          xcrun stapler validate "$APP_PATH" || echo "::warning::stapler validate failed on .app"
          xcrun stapler validate "$DMG_PATH" || echo "::warning::stapler validate failed on .dmg"

      - name: Clean up keychain + API key
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          security delete-keychain "$RUNNER_TEMP/macos-build.keychain" || true
          rm -rf "$HOME/.appstoreconnect" || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          # `if-no-files-found` is evaluated over all patterns together, so the
          # updater globs matching nothing (not activated yet) is fine.
          #
          # NOTE for steam.yml: it locates the .app with `find -maxdepth 6 -name
          # '*.app' -type d`, so the added globs cannot confuse it — they are
          # files, not directories, and do not change the common path prefix
          # upload-artifact strips.
          if-no-files-found: error
