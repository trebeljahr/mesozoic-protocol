# Tauri Windows build, signed with Azure Trusted Signing.
#
# Required repo secrets:
#   AZURE_TENANT_ID          — Azure AD tenant containing the Trusted Signing account
#   AZURE_CLIENT_ID          — service principal app ID (or federated identity client ID)
#   AZURE_CLIENT_SECRET      — service principal secret (omit if using OIDC; see below)
#   AZURE_TS_ACCOUNT         — Trusted Signing account name
#   AZURE_TS_PROFILE         — certificate profile name (Public Trust if eligible, else Private Trust)
#   AZURE_TS_ENDPOINT        — e.g. https://wus2.codesigning.azure.net
#
# OIDC upgrade (recommended once secret-auth works): drop AZURE_CLIENT_SECRET,
# add `permissions: id-token: write` to the job, and configure a federated
# identity credential on the Azure AD app registration pointing at this repo.

name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap gate on a Linux runner: catch a missing secret, a type error, or a
  # half-applied version bump in ~90s instead of after a full Rust build plus
  # a Trusted Signing round trip. Mirrors ci.yml plus the secret check
  # specific to this workflow.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # An empty Azure secret produces a metadata.json with blank fields and
      # signtool fails with an unhelpful HRESULT. Assert presence up front.
      # Names only are printed — never values.
      - name: Verify required secrets are present
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
        run: |
          set -euo pipefail
          # AZURE_CLIENT_SECRET stays in this list until the OIDC upgrade
          # described in the header comment is done; drop it from `required`
          # at the same time you add `id-token: write`.
          required=(
            AZURE_TENANT_ID
            AZURE_CLIENT_ID
            AZURE_CLIENT_SECRET
            AZURE_TS_ACCOUNT
            AZURE_TS_PROFILE
            AZURE_TS_ENDPOINT
          )
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing or empty repo secret(s): ${missing[*]}"
            echo "Set them under Settings → Secrets and variables → Actions."
            echo "The header comment in this workflow file explains what each one is."
            exit 1
          fi
          echo "All ${#required[@]} required secrets are present."

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      # See ci.yml for why this is `tsc -b` and not `tsc -b --noEmit`.
      - name: Typecheck
        run: pnpm exec tsc -b

      # tauri.conf.json's version ends up in the MSI/NSIS filenames and in the
      # installer's ProductVersion, so drift produces a mislabelled installer.
      - name: Version declarations agree
        run: node scripts/sync-version.mjs --check

      - name: Unit tests
        run: pnpm test

  build:
    needs: preflight
    runs-on: windows-latest
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_CODE_SIGNING_DLIB: ${{ github.workspace }}\dlib\bin\x64\Azure.CodeSigning.Dlib.dll
      AZURE_CODE_SIGNING_METADATA: ${{ github.workspace }}\dlib\metadata.json
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: cargo-windows-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Trusted Signing client (dlib)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dlib | Out-Null
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.60 -OutputDirectory dlib-pkg -ExcludeVersion
          Copy-Item -Recurse -Force dlib-pkg\Microsoft.Trusted.Signing.Client\bin dlib\
          @"
          {
            "Endpoint": "${{ secrets.AZURE_TS_ENDPOINT }}",
            "CodeSigningAccountName": "${{ secrets.AZURE_TS_ACCOUNT }}",
            "CertificateProfileName": "${{ secrets.AZURE_TS_PROFILE }}"
          }
          "@ | Out-File -FilePath dlib\metadata.json -Encoding utf8

      - name: Verify signtool sees dlib
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe `
            | Where-Object { $_.FullName -match "x64\\signtool.exe$" } | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          Write-Host "signtool: $signtool"
          if (-not (Test-Path "$env:AZURE_CODE_SIGNING_DLIB")) {
            throw "dlib missing at $env:AZURE_CODE_SIGNING_DLIB"
          }

      - run: pnpm install --frozen-lockfile

      # Decides whether this build also produces the auto-updater payload and
      # its signature. Soft-skips with a ::notice:: until the signing keypair
      # exists — see scripts/ci/updater-gate.sh and DISTRIBUTION.md.
      - name: Auto-updater activation gate
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bash scripts/ci/updater-gate.sh

      # The updater signature is generated over the already Trusted-Signing-
      # signed installer, so an installed update carries the same signature a
      # fresh download does.
      - name: Build + sign (Tauri)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build ${{ steps.updater.outputs.args }}

      - name: Verify signatures
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe `
            | Where-Object { $_.FullName -match "x64\\signtool.exe$" } | Select-Object -First 1).FullName
          Get-ChildItem -Recurse -Include *.exe,*.msi -Path src-tauri\target\release\bundle | ForEach-Object {
            Write-Host "Verifying $_"
            & $signtool verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "verify failed for $_" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          # `if-no-files-found` is evaluated over all patterns together, so the
          # .sig glob matching nothing (updater not activated yet) is fine.
          # Only the NSIS signature is collected — the manifest updates from
          # the NSIS installer, not the MSI. See scripts/ci/make-updater-manifest.mjs.
          if-no-files-found: error

      # A Steam depot ships the game directory, not an installer — Steam does
      # the installing. This is the unpacked build for .github/workflows/steam.yml.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            src-tauri/target/release/mesozoic-protocol.exe
            src-tauri/target/release/*.dll
          if-no-files-found: error
