# Windows Authenticode signing uses OIDC in the restricted windows-signing environment.
# See DISTRIBUTION.md for identity, profile scope, and verification instructions.

name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Catch source failures before allocating a Windows runner.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      # See ci.yml for why this is `tsc -b` and not `tsc -b --noEmit`.
      - name: Typecheck
        run: pnpm exec tsc -b

      # tauri.conf.json's version ends up in the MSI/NSIS filenames and in the
      # installer's ProductVersion, so drift produces a mislabelled installer.
      - name: Version declarations agree
        run: node scripts/sync-version.mjs --check

      - name: Unit tests
        run: pnpm test

  build:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 90
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CODE_SIGNING_DLIB: ${{ github.workspace }}\dlib\bin\x64\Azure.CodeSigning.Dlib.dll
      AZURE_CODE_SIGNING_METADATA: ${{ github.workspace }}\dlib\metadata.json
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: cargo-windows-${{ hashFiles('src-tauri/Cargo.lock') }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install signing client and metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dlib | Out-Null
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.60 -OutputDirectory dlib-pkg -ExcludeVersion -Source https://api.nuget.org/v3/index.json -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'Signing client installation failed' }
          Copy-Item -Recurse -Force dlib-pkg\Microsoft.Trusted.Signing.Client\bin dlib\
          $config = Get-Content scripts/ci/windows-signing.json -Raw | ConvertFrom-Json
          @{
            Endpoint = $config.AZURE_TS_ENDPOINT
            CodeSigningAccountName = $config.AZURE_TS_ACCOUNT
            CertificateProfileName = $config.AZURE_TS_PROFILE
            CorrelationId = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            ExcludeCredentials = @(
              'EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content $env:AZURE_CODE_SIGNING_METADATA

      - run: pnpm install --frozen-lockfile

      # Decides whether this build also produces the auto-updater payload and
      # its signature. Soft-skips with a ::notice:: until the signing keypair
      # exists — see scripts/ci/updater-gate.sh and DISTRIBUTION.md.
      - name: Auto-updater activation gate
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bash scripts/ci/updater-gate.sh

      - name: Azure login with repository OIDC identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ce0c906e-8a84-4877-afd9-cdf103ddaacb
          allow-no-subscriptions: true

      # The updater signature is generated over the already Trusted-Signing-
      # signed installer, so an installed update carries the same signature a
      # fresh download does.
      - name: Build + sign (Tauri)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build ${{ steps.updater.outputs.args }}

      # Tauri restores the unsigned Cargo executable after packaging installers.
      # Sign the final standalone artifact used by the portable/Steam upload.
      - name: Sign final portable executable
        shell: pwsh
        run: ./scripts/ci/sign-windows.ps1 -Path src-tauri/target/release/mesozoic-protocol.exe

      - name: Verify app and installer signatures and publisher
        shell: pwsh
        run: ./scripts/ci/verify-windows-signatures.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-signature-evidence
          path: windows-signatures.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          # `if-no-files-found` is evaluated over all patterns together, so the
          # .sig glob matching nothing (updater not activated yet) is fine.
          # Only the NSIS signature is collected — the manifest updates from
          # the NSIS installer, not the MSI. See scripts/ci/make-updater-manifest.mjs.
          if-no-files-found: error

      # A Steam depot ships the game directory, not an installer — Steam does
      # the installing. This is the unpacked build for .github/workflows/steam.yml.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            src-tauri/target/release/mesozoic-protocol.exe
            src-tauri/target/release/*.dll
          if-no-files-found: error
