# Steam upload for a `v*` tag.
#
# Soft-skips (notice + exit 0) until Steamworks is actually set up, so this can
# live on main before the Steam Direct app exists. It becomes active once all
# of the following are configured:
#
#   vars.STEAM_APP_ID    — repository variable, the numeric Steam App ID
#   STEAM_USERNAME       — secret, the Steamworks build account username
#   STEAM_CONFIG_VDF     — secret, base64 of a Steam Guard-authenticated
#                          config.vdf (see steam/README.md for how to produce it)
#
# Optional:
#   vars.STEAM_RELEASE_BRANCH — Steam beta branch to set live automatically.
#                               Leave unset (recommended) so builds upload but
#                               are promoted by hand in the Steamworks dashboard.
#
# Auto-updater carve-out: a Steam build must never self-update. A Tauri update
# overwrites files SteamPipe owns, so the next "Verify integrity of game files"
# silently reverts it, and the perMachine NSIS installer would land a second
# copy next to Steam's. The updater is gated on the `updater` Cargo feature,
# which is opt-in and only passed by the installer builds — but this workflow
# does not build anything, it reuses the `*-portable` artifacts from the very
# same `tauri build` runs that produce the installers, so the depot binary IS
# the installer binary. The enforcement that actually applies here is the
# runtime Steam check in src-tauri/src/updater.rs, which refuses to register
# the plugin when SteamAppId / steam_appid.txt / a `steamapps` path segment is
# present. See DISTRIBUTION.md → "Auto-update".
#
# Uses game-ci/steam-deploy rather than driving steamcmd directly: the fiddly
# part of a Steam upload in CI is not the depot layout, it is getting steamcmd
# past Steam Guard non-interactively (the config.vdf dance, the sentry file,
# steamcmd's habit of exiting 0 on some failures). That action encapsulates
# exactly that, is maintained, and is what the rest of the ecosystem uses. The
# vdf templates in steam/ cover the manual `steamcmd +run_app_build` path and
# document the depot IDs.

name: Steam

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to upload
        required: true
        type: string

permissions:
  contents: read
  actions: read   # required to download the platform build artifacts

concurrency:
  group: steam-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Secrets cannot be evaluated in a job-level `if:`, so the gate is its own
  # job that exports a plain output.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${STEAM_APP_ID:-}" ]     || missing+=("vars.STEAM_APP_ID")
          [ -n "${STEAM_USERNAME:-}" ]   || missing+=("secrets.STEAM_USERNAME")
          [ -n "${STEAM_CONFIG_VDF:-}" ] || missing+=("secrets.STEAM_CONFIG_VDF")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::Steam upload skipped — not configured yet: ${missing[*]}. See steam/README.md for the one-time Steamworks setup."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  upload:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve tag and commit
        id: ref
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for desktop builds and download their artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.ref.outputs.sha }}
          WORKFLOWS: build-macos.yml build-windows.yml build-linux.yml
          OUT_DIR: ${{ runner.temp }}/artifacts
        run: bash scripts/ci/gather-build-artifacts.sh

      # Steam depots contain the runnable game directory. Windows and Linux
      # use the portable artifacts. macOS uses the signed .app.tar.gz archive
      # so GitHub artifact storage cannot discard its modes or symlinks.
      - name: Stage depot contents
        env:
          ART_DIR: ${{ runner.temp }}/artifacts
          DEPOT_DIR: ${{ runner.temp }}/depots
        run: |
          set -euo pipefail
          mkdir -p "$DEPOT_DIR/windows" "$DEPOT_DIR/macos" "$DEPOT_DIR/linux"

          cp -R "$ART_DIR/windows-portable/." "$DEPOT_DIR/windows/"
          cp -R "$ART_DIR/linux-portable/."   "$DEPOT_DIR/linux/"

          # The macOS build always archives the final signed/notarized app,
          # including when updater signing is disabled. Reject an ambiguous
          # artifact set instead of silently selecting the first candidate.
          mapfile -t APP_ARCHIVES < <(find "$ART_DIR/macos-bundles" -maxdepth 6 -type f -name '*.app.tar.gz')
          if [ "${#APP_ARCHIVES[@]}" -ne 1 ]; then
            echo "::error::expected exactly one signed macOS app archive, found ${#APP_ARCHIVES[@]}"
            exit 1
          fi
          tar -xzpf "${APP_ARCHIVES[0]}" -C "$DEPOT_DIR/macos"
          mapfile -t MAC_CONTENTS < <(find "$DEPOT_DIR/macos" -mindepth 1 -maxdepth 1)
          if [ "${#MAC_CONTENTS[@]}" -ne 1 ] || [[ "${MAC_CONTENTS[0]}" != *.app ]] || [ ! -d "${MAC_CONTENTS[0]}" ]; then
            echo "::error::macOS archive must contain exactly one .app bundle"
            exit 1
          fi
          APP_DIR="${MAC_CONTENTS[0]}"
          test -x "$APP_DIR/Contents/MacOS/mesozoic-protocol"

          # Windows/Linux standalone binaries stay SDK-free. Only their Steam
          # depots receive the runtime-loaded libraries. macOS already embeds
          # its dylib before signing and notarization; never mutate that bundle.
          node scripts/ci/prepare-steam-sdk.mjs windows "$DEPOT_DIR/windows"
          node scripts/ci/prepare-steam-sdk.mjs linux "$DEPOT_DIR/linux"
          test -s "$APP_DIR/Contents/Frameworks/libsteam_api.dylib"
          test -s "$APP_DIR/Contents/Resources/licenses/STEAM-SDK-NOTICE.txt"

          # The Linux portable executable still travels as a raw artifact.
          chmod +x "$DEPOT_DIR/linux/mesozoic-protocol"

          # A depot holds the runnable game, never an installer and never an
          # updater payload. If one of those ever shows up here, an
          # upload-artifact glob upstream widened and Steam would ship players
          # a file they have to run by hand.
          strays=$(find "$DEPOT_DIR" -type f \
            \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.dmg' -o -name '*.app.tar.gz' \
               -o -name '*.sig' \))
          if [ -n "$strays" ]; then
            echo "::error::installer or updater artifacts leaked into the Steam depots:"
            echo "$strays"
            exit 1
          fi

          echo "--- depot contents ---"
          find "$DEPOT_DIR" -maxdepth 3 | sort

      # depotNPath maps to depot ID <appId> + N, which matches the depot IDs
      # Steamworks creates by default. If your depot IDs differ, use the
      # steam/*.vdf templates with steamcmd instead — see steam/README.md.
      - name: Upload to Steam
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ vars.STEAM_APP_ID }}
          buildDescription: ${{ steps.ref.outputs.tag }}
          rootPath: ${{ runner.temp }}/depots
          depot1Path: windows
          depot2Path: macos
          depot3Path: linux
          releaseBranch: ${{ vars.STEAM_RELEASE_BRANCH }}
