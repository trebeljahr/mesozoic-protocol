<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b1016" />
    <meta name="application-name" content="Mesozoic Protocol" />
    <!-- Only the 700 cut is preloaded: it is the one weight the first screen
         paints (the main-menu title). 500 and 600 are in-game UI and load on
         demand, so preloading them would just be bytes fetched before the
         menu that needs them. The self-hosted @font-face rules live in
         src/index.css, which the bundler emits as a separate stylesheet —
         without this hint the font is a two-hop discovery (HTML → CSS → woff2)
         and the title visibly swaps in late. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/rajdhani-latin-700.woff2"
      crossorigin
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/32x32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/icons/128x128.png" />
    <link rel="canonical" href="https://play.mesozoicprotocol.com/" />
    <meta
      name="description"
      content="Command sci-fi towers, survive dinosaur waves, unlock upgrades, and defend a hostile 3D world in a browser tower-defense strategy game."
    />
    <meta name="robots" content="index,follow" />
    <meta property="og:site_name" content="Mesozoic Protocol" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mesozoic Protocol | 3D Tower Defense Game" />
    <meta
      property="og:description"
      content="Command sci-fi towers, survive dinosaur waves, unlock upgrades, and defend a hostile 3D world in a browser tower-defense strategy game."
    />
    <meta property="og:url" content="https://play.mesozoicprotocol.com/" />
    <meta property="og:image" content="https://play.mesozoicprotocol.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mesozoic Protocol 3D tower defense preview" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mesozoic Protocol | 3D Tower Defense Game" />
    <meta
      name="twitter:description"
      content="Command sci-fi towers, survive dinosaur waves, unlock upgrades, and defend a hostile 3D world in a browser tower-defense strategy game."
    />
    <meta name="twitter:image" content="https://play.mesozoicprotocol.com/og-image.png" />
    <meta name="twitter:image:alt" content="Mesozoic Protocol 3D tower defense preview" />
    <title>Mesozoic Protocol | 3D Tower Defense Game</title>
    <!--BUILD-SHA-->
    <!--PLAUSIBLE-->
  </head>

</html>
