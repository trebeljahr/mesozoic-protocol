# Host-based split, one container, one dist:
#   mesozoicprotocol.com       — marketing site (landing, press kit, privacy)
#   play.mesozoicprotocol.com  — the game (canonical game host)
#   protocol.trebeljahr.com    — retired host; 301-redirects to the play
#                                subdomain so old links and bookmarks keep
#                                working after the domain migration.
# TLS terminates at the Coolify proxy; all hosts route to this container
# with the Host header preserved.

# Canonicalize www → apex.
server {
    listen 80;
    server_name www.mesozoicprotocol.com;
    return 301 https://mesozoicprotocol.com$request_uri;
}

# Marketing site — apex domain. Root is the landing page; the game lives
# on the play subdomain.
server {
    listen 80;
    server_name mesozoicprotocol.com;
    root /usr/share/nginx/html;

    location = / {
        try_files /about.html =404;
    }

    # The landing page is the root here; keep /about working as an alias.
    location = /about {
        return 301 https://mesozoicprotocol.com/;
    }

    location = /press {
        try_files /press.html =404;
    }

    location = /privacy {
        try_files /privacy.html =404;
    }

    location = /imprint {
        try_files /imprint.html =404;
    }

    # Convenience path → game.
    location = /play {
        return 301 https://play.mesozoicprotocol.com/;
    }

    # Static assets (og-image, icons, press downloads) resolve normally.
    # No SPA fallback on the marketing host: unknown paths are real 404s.
    location / {
        try_files $uri $uri/ =404;
    }
}

# Game — canonical play subdomain. default_server so bare-IP requests and
# not-yet-configured hosts still reach the game.
server {
    listen 80 default_server;
    server_name play.mesozoicprotocol.com _;
    root /usr/share/nginx/html;
    index index.html;

    # Privacy policy is canonical at mesozoicprotocol.com/privacy; keep a
    # copy answering here too so deep links to /privacy never 404.
    location = /privacy {
        try_files /privacy.html =404;
    }

    # Marketing pages moved to the apex domain.
    location = /about {
        return 301 https://mesozoicprotocol.com/;
    }

    location = /press {
        return 301 https://mesozoicprotocol.com/press;
    }

    location = /imprint {
        return 301 https://mesozoicprotocol.com/imprint;
    }

    # SPA fallback: any unknown path falls through to index.html so the
    # client-side app can handle deep links without a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Retired host — the old game domain 301s to the play subdomain, path
# preserved, so deep links and bookmarks survive the migration. Kept in
# Coolify/DNS only so this redirect has a TLS cert; serves nothing else.
server {
    listen 80;
    server_name protocol.trebeljahr.com;
    return 301 https://play.mesozoicprotocol.com$request_uri;
}
