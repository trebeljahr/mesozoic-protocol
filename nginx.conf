server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Extensionless privacy URL.
    # Play Console + App Store Connect both require a stable privacy URL;
    # we list /privacy in those forms, so map it to the static page.
    location = /privacy {
        try_files /privacy.html =404;
    }

    # SPA fallback: any unknown path falls through to index.html so the
    # client-side app can handle deep links without a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
