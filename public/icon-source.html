<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Icon source — Pulse Tower</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      #c {
        width: 1024px;
        height: 1024px;
        display: block;
        background: radial-gradient(ellipse at 50% 38%, #4a648c 0%, #1a2030 70%, #0a0e18 100%);
        border-radius: 220px;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1024" height="1024"></canvas>
    <script type="module">
      // esm.sh resolves the GLTFLoader's bare `from 'three'` specifier; the unpkg URL does not.
      import * as THREE from "https://esm.sh/three@0.167.1";
      import { DRACOLoader } from "https://esm.sh/three@0.167.1/examples/jsm/loaders/DRACOLoader.js";
      import { GLTFLoader } from "https://esm.sh/three@0.167.1/examples/jsm/loaders/GLTFLoader.js";

      const canvas = document.getElementById("c");
      // preserveDrawingBuffer keeps the rendered frame readable for later
      // canvas.toDataURL / drawImage capture from the screenshot tooling.
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(2);
      renderer.setSize(1024, 1024, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      const scene = new THREE.Scene();

      // 3/4 front, slightly elevated
      const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 50);
      camera.position.set(3.6, 1.6, 3.0);
      camera.lookAt(0, 0.55, 0);

      // Studio-style lighting — neutral key + warm fill + cool rim.
      scene.add(new THREE.HemisphereLight("#bcd8ff", "#3a2a1a", 0.7));
      const key = new THREE.DirectionalLight("#fff4dc", 1.7);
      key.position.set(4, 5, 3);
      scene.add(key);
      const fill = new THREE.DirectionalLight("#88aaff", 0.7);
      fill.position.set(-3, 3, 2);
      scene.add(fill);
      const rim = new THREE.DirectionalLight("#ffd28c", 1.2);
      rim.position.set(-2, 3, -3);
      scene.add(rim);
      scene.add(new THREE.AmbientLight("#ffffff", 0.35));

      const draco = new DRACOLoader();
      // Same vendored decoder the app uses (see public/draco/README.md), so
      // this authoring page contributes no Google CDN reference to the
      // shipped dist/. It still needs the network for the esm.sh three
      // imports above — it is a one-off icon authoring tool, opened by hand,
      // never loaded by the game itself.
      draco.setDecoderPath("/draco/");
      const loader = new GLTFLoader();
      loader.setDRACOLoader(draco);
      loader.load(
        "/models/tower_pulse.glb",
        (gltf) => {
          const root = gltf.scene;
          // Normalize to ~1.5 unit height so framing is consistent.
          const box = new THREE.Box3().setFromObject(root);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z, 0.001);
          // Larger target so the tower fills more of the frame — important for
          // legibility at 32×32 / favicon sizes.
          const target = 2.3;
          const s = target / maxDim;
          root.scale.setScalar(s);
          // Re-center; nudge slightly down so the muzzle dominates the upper half.
          root.position.set(-center.x * s, -box.min.y * s - 0.05, -center.z * s);
          // Three-quarter face — rotate ~25° so the barrel points toward upper-right.
          root.rotation.y = -Math.PI * 0.18;
          scene.add(root);

          // Subtle ground disc to anchor the silhouette without dominating.
          const disc = new THREE.Mesh(
            new THREE.CircleGeometry(0.95, 48),
            new THREE.MeshBasicMaterial({ color: "#0a0e18", transparent: true, opacity: 0.55 }),
          );
          disc.rotation.x = -Math.PI / 2;
          disc.position.y = 0.001;
          scene.add(disc);

          renderer.render(scene, camera);
          // Tag for screenshot tooling to detect "ready"
          document.title = "READY · Icon source — Pulse Tower";
        },
        undefined,
        (err) => {
          console.error("icon-source: gltf load failed", err);
          document.title = "ERROR · Icon source — Pulse Tower";
        },
      );
    </script>
  </body>
</html>
