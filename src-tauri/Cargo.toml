[package]
name = "mesozoic-protocol"
version = "0.1.0"
description = "Mesozoic Protocol — roguelite tower defense"
authors = ["you"]
edition = "2021"

[lib]
name = "mesozoic_protocol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The updater plugin has no iOS/Android implementation, so it is declared for
# desktop targets only. It is also `optional` — see the `updater` feature below.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Opt-in, NOT in `default`, on purpose — it has to fail safe in both directions:
#
#   * A build that forgets the flag ships without any self-update machinery.
#     That is the correct outcome for the Steam depot (a Tauri updater
#     overwriting the install desynchronizes the SteamPipe depot: the next
#     "Verify integrity of game files" reverts it, and the perMachine NSIS
#     installer would land a second copy next to Steam's).
#   * The inverse default ("steam disables it") would mean every build that
#     forgets a flag ships a self-updater — including the depot.
#
# Enabling this only compiles the plugins in. Whether the app can actually
# update is a second, independent gate: `plugins.updater` (pubkey + endpoints)
# only exists in src-tauri/tauri.updater.conf.json, which CI merges in with
# `--config` under the same condition. See DISTRIBUTION.md → "Auto-update".
updater = ["dep:tauri-plugin-updater"]
